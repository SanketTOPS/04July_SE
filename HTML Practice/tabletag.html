<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Tag</title>
</head>

<body>
    <h1>
        <center>Table Tag in HTML</center>
    </h1>
    <hr>

    <table border="2">
        <tr>
            <th>ID</th>
            <th>Name</th>
            <th>Subject</th>
            <th>City</th>
        </tr>
        <tr>
            <td>1</td>
            <td>Sanket</td>
            <td>Python</td>
            <td>Rajkot</td>
        </tr>
        <tr>
            <td>2</td>
            <td>Nirav</td>
            <td>Java</td>
            <td>Surat</td>
        </tr>
    </table>

</body>

</html>
