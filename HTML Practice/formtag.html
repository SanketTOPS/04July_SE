<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Form in HTML</title>
</head>

<body>
    <h1>
        <center>Form Tag in HTML</center>
    </h1>
    <hr>

    <form>
        <input type="text" placeholder="Firstname"> <br>
        <input type="text" placeholder="Lastname"> <br>
        <input type="email" placeholder="Email"> <br>
        <input type="password" placeholder="Password"> <br>
        <input type="number" placeholder="Mobile"> <br>
        <input type="radio" name="gen" checked>Male
        <input type="radio" name="gen">Female <br>
        <input type="checkbox">Gujrati <br>
        <input type="checkbox">Hindi <br>
        <input type="checkbox">English <br>
        <input type="file"> <br>
        <input type="color" name="" id=""> <br>
        <textarea placeholder="Address"></textarea> <br>
        <input type="submit" value="Save">
        <input type="button" value="Hello">
        <input type="reset" name="" id="">
    </form>
</body>

</html>
