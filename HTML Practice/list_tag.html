<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>List Tag</title>
</head>

<body>
    <h1>
        <center>List Tag in HTML</center>
    </h1>
    <hr>
    <h3><u>Technical Course</u></h3>
    <!-- Order List -->
    <ol>
        <li>Python</li>
        <li>JAVA</li>
        <li>PHP</li>
        <li>Node</li>
    </ol>
    <hr>
    <h3><u>Non-Technical Course</u></h3>
    <!-- Unorder List -->
    <ul>
        <li>Digital Marketing</li>
        <li>UI-UX</li>
        <li>Web Designing</li>
        <li>Testing</li>
    </ul>
</body>

</html>
